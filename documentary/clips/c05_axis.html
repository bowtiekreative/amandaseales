* { margin:0; padding:0; box-sizing:border-box; }
:root { --canvas:#07090D; --ink:#F5F7FA; --body:#C5C7CE; --muted:#7E838E;

html,body { width:1920px; height:1080px; background:var(--canvas); overflow:hidden; }
body.v { width:1080px; height:1920px; }
body { font-family:'Inter',sans-serif; color:var(--body); position:relative;
  -webkit-font-smoothing:antialiased; }
.stage { position:absolute; inset:0; padding:110px 130px; display:flex; flex-direction:column; }
body.v .stage { padding:120px 80px; }
.backlight { position:absolute; width:1600px; height:1600px; border-radius:50%; top:-900px; left:-400px;
  background:radial-gradient(circle, rgba(255,255,255,.07) 0%, transparent 62%); }
.micro { font-size:26px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:20px; }
.micro .tick { width:28px; height:3px; background:var(--accent); }
h1 { font-weight:600; color:var(--ink); font-size:150px; letter-spacing:-.05em; line-height:1.02; }
body.v h1 { font-size:110px; }
h2 { font-weight:600; color:var(--ink); font-size:96px; letter-spacing:-.045em; line-height:1.05; }
body.v h2 { font-size:76px; }
.big { font-size:44px; line-height:1.4; color:var(--body); }
body.v .big { font-size:38px; }
.small { font-size:27px; color:var(--muted); line-height:1.5; }
.cite { position:absolute; left:130px; right:130px; bottom:52px; font-size:23px; color:var(--muted);
  border-top:1px solid var(--hair2); padding-top:22px; display:none; }
body.cite .cite { display:block; }
body.v .cite { left:80px; right:80px; }
.brand { position:absolute; right:130px; top:118px; font-size:24px; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
body.v .brand { right:80px; }
.grow { flex:1; }
/* animation primitives — all use animation-fill-mode both, paused by default via SEEK */
.a { opacity:0; }
@keyframes rise { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
@keyframes pop  { 0% { opacity:0; transform:scale(.92); } 60% { opacity:1; transform:scale(1.03); } 100% { opacity:1; transform:scale(1); } }
@keyframes draw { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes fadein { from { opacity:0; } to { opacity:1; } }
@keyframes dim  { from { opacity:1; } to { opacity:.18; } }
@keyframes strike { from { width:0; } to { width:100%; } }
.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--body);
opacity:0;animation:fadein 400ms ease both;}
#field .dot:nth-child(-n+28){}
.dot:nth-child(n+29){animation:fadein 400ms ease both, dim 900ms ease 8000ms both;}</style></head>

<script>
const Q = new URLSearchParams(location.search);
if (Q.get('f')==='v') document.body.classList.add('v');
if (Q.get('cite')==='1') document.body.classList.add('cite');
window.COUNTERS = window.COUNTERS || [];
function fmt(n){ return n.toLocaleString('en-US'); }
window.SEEK = function(ms){
  document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
  for (const c of COUNTERS){
    const t = Math.min(1, Math.max(0, (ms - c.start) / c.dur));
    const eased = 1 - Math.pow(1 - t, 3);
    c.el.textContent = fmt(Math.round(c.from + (c.to - c.from) * eased)) + (c.suffix||'');
  }
};
window.PLAY = function(){
  const t0 = performance.now();
  function tick(){ SEEK(performance.now() - t0); requestAnimationFrame(tick); }
  tick();
};
window.addEventListener('load', () => { if (!Q.has('still')) PLAY(); });
</script>
